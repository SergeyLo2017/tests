  --f-disp:"Rubik","Golos Text",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
 background-image:linear-gradient(color-mix(in srgb,var(--line) 50%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 50%,transparent) 1px,transparent 1px);background-size:28px 28px;
 padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
.wrap.wide{max-width:1040px}

h2{font-size:1.2rem}
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:3px;padding:22px;margin-bottom:16px}

.muted{color:var(--muted)}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],select{width:100%;max-width:100%;padding:11px 12px;border:1.5px solid var(--ink);border-radius:3px;background:var(--surface);color:var(--ink);font:inherit}

.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:3px;padding:10px 16px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:3px 3px 0 var(--ink)}
.btn.pri:active{box-shadow:none;transform:translate(3px,3px)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .sp{flex:1}

.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.note{padding:12px 14px;border:1.5px dashed var(--ink);margin:14px 0;font-size:.94rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:var(--soft);font-family:var(--f-disp);font-weight:600}
td.n{font-variant-numeric:tabular-nums;text-align:right}

.qrs .card{margin:0;padding:14px;text-align:center}
.qrs svg,.qrs img{max-width:100%;height:auto;display:block;margin:8px auto}
textarea{width:100%;min-height:110px;padding:10px;border:1.5px solid var(--ink);border-radius:3px;background:var(--surface);color:var(--ink);font:13px ui-monospace,Menlo,Consolas,monospace}
.code{word-break:break-all;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:10px;border:1px solid var(--line);max-height:120px;overflow:auto}
.rev{padding:12px;border-left:4px solid var(--line);margin-bottom:10px}

@media(max-width:560px){.card{padding:16px}.grade{font-size:3.4rem}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}

.card{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}

.opt[aria-pressed=true]{animation:pop .25s ease}
.bar i{transition:width .5s cubic-bezier(.2,.7,.2,1)}

.grade{display:inline-block;animation:pop .6s ease .9s both}
.rev{animation:rise .4s ease both;animation-delay:calc(var(--d,0)*50ms)}
.pill.bad{animation:shake .4s ease}
#cp{animation:glow 1.6s ease-out 1s 2}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}

/* ===== Яскравий ігровий вигляд ===== */
:root{--bg:#5b36e8;--surface:#ffffff;--ink:#1b1340;--muted:#5d5683;--line:#ddd5f7;--accent:#6c3ff5;--on-accent:#fff;--soft:#efe9ff;--yellow:#ffd23f;--f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-disp:"Rubik","Nunito",system-ui,sans-serif;color-scheme:light}

.opt:nth-child(1){--c:#ff8a8a}.opt:nth-child(2){--c:#ffd23f}.opt:nth-child(3){--c:#5fe0b8}.opt:nth-child(4){--c:#7fb6ff}
.opt b{display:grid;place-items:center;min-width:2rem;height:2rem;border-radius:50%;background:#fff;border:3px solid var(--ink);color:var(--ink);font-family:var(--f-disp)}
.opt:hover{transform:translate(-2px,-2px);border-color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--c);transform:translate(3px,3px);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}

.grade{font-size:5.4rem;background:linear-gradient(90deg,#ff5fa2,#6c3ff5);-webkit-background-clip:text;background-clip:text;color:transparent}
.note{border:3px dashed var(--ink);border-radius:14px;background:var(--soft)}
.pill{border:2px solid var(--ink);font-weight:800}
.rev{border-radius:12px}
th{background:var(--yellow);border-color:var(--ink)}td,th{border-color:var(--ink)}
.qrs .card{box-shadow:4px 4px 0 var(--ink)}
.code{border:2px solid var(--ink);border-radius:10px}
@media(max-width:560px){.tw th,.tw td{padding:8px 6px;font-size:.82rem}.tw th:nth-child(1),.tw td:nth-child(1){max-width:110px}}

.qov{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto;background:radial-gradient(circle at 30% 20%,#ff5ea8,transparent 45%),radial-gradient(circle at 80% 80%,#2ec4ff,transparent 45%),#2a1a6e;background-size:140% 140%;animation:qbg 8s ease-in-out infinite alternate}

.qcode{background:#fff;border-radius:20px;padding:14px;width:min(78vw,48vh,620px);animation:qpulse 2s ease-in-out infinite;color:#000}

.qring::before{content:"";position:absolute;inset:-14px;border-radius:38px;box-shadow:0 0 40px 10px rgba(255,255,255,.55);animation:qglow 1.8s ease-in-out infinite;pointer-events:none}

.qnav .btn{color:#1b2321;background:#fff;border-color:#1b2321}.qnav .btn.pri{background:#ffd23f}

@keyframes qspin{to{filter:hue-rotate(360deg)}}
@keyframes qpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

@keyframes qfade{from{opacity:0}to{opacity:1}}
@keyframes qbg{from{background-position:0 0}to{background-position:100% 100%}}
@media (prefers-reduced-motion:reduce){.qov,.qring,.qcode,.qring::before{animation:none!important}}
</style>

ор почне виконувати дії"],"a":2}]},

"t8-l43":{"grade":"8","classes":["8-А","8-Б","8-В","8-І"],"title":"Проєкт «Піцерія» (частина 2)","sub":"Інформатика · 8 клас · Урок 43","q":[{"q":"Скільки шкал потрібно, щоб ціна залежала і від розміру, і від кількості піц?","o":["Одна","Три","Дві","Жодної"],"a":2},{"q":"Що робить користувач зі шкалою?","o":["Вибирає число, рухаючи повзунок","Вводить довільний текст","Вмикає або вимикає параметр","Малює лінію на екрані"],"a":0},{"q":"Який елемент у проєкті показує ціну?","o":["Шкала","Перемикач","Текстове поле","Напис"],"a":3},{"q":"Яка формула ціни в проєкті «Піцерія» (частина 2)?","o":["ціна розміру + кількість","ціна розміру × кількість","кількість − ціна розміру","ціна розміру ÷ кількість"],"a":1},{"q":"Розмір 1 коштує 80 грн, розмір 2 — 120 грн, розмір 3 — 150 грн. Скільки коштують 3 піци розміру 2?","o":["123 грн","270 грн","450 грн","360 грн"],"a":3},{"q":"Скільки коштують 2 піци розміру 3 (ціна розміру 3 — 150 грн)?","o":["300 грн","152 грн","450 грн","75 грн"],"a":0},{"q":"Де треба писати оновлення напису з ціною?","o":["Лише в обробнику шкали кількості","В обробнику кожної шкали","Лише в обробнику шкали розміру","Ніде, напис оновиться сам"],"a":1},{"q":"Ціна змінюється, коли рухають шкалу кількості, але не змінюється від шкали розміру. Яка причина?","o":["Шкала розміру зламана","Шкала кількості має бути перемикачем","Забули оновити напис в обробнику шкали розміру","Напис не вміє показувати ціну"],"a":2},{"q":"Як правильно перевірити програму?","o":["Рухати спершу одну шкалу, потім другу, пробувати різні комбінації","Перевірити лише один раз на розмірі 1","Перевірити лише шкалу кількості","Не перевіряти, якщо програма запускається"],"a":0},{"q":"Розмір 1 (80 грн), кількість 4. Яку ціну має показати напис?","o":["84 грн","80 грн","320 грн","20 грн"],"a":2},{"q":"Учень написав для розміру 2 і кількості 3 ціну 120 + 3 = 123 грн. Що не так?","o":["Треба відняти: 120 − 3 = 117 грн","Треба множити: 120 × 3 = 360 грн","Треба ділити: 120 ÷ 3 = 40 грн","Усе правильн "t8-l52":{"grade":"8","classes":["8-А","8-Б","8-В","8-І"],"title":"Створення колажу в графічному редакторі GIMP","sub":"Інформатика · 8 клас · Урок 52","q":[{"q":"З чого складається колаж?","o":["З одного зображення без шарів","Лише з тексту","З одного кольору","З кількох зображень"],"a":3},{"q":"Куди вставляють виділену й скопійовану частину зображення?","o":["В той самий шар, де вона була","У панель інструментів","Як новий шар на нове полотно","Лише в окремий файл .png"],"a":2},{"q":"Що робить маска шару?","o":["Видаляє частину зображення назавжди","Приховує частину зображення без видалення","Збільшує яскравість шару","Об'єднує всі шари в один"],"a":1},{"q":"Скільки зображень потрібно для колажу в практичній роботі?","o":["2–3","Рівно одне","10 і більше","Жодного"],"a":0},{"q":"Навіщо кожному елементу колажу свій шар?","o":["Щоб рухати й змінювати його окремо","Щоб колаж мав менший розмір","Щоб не треба було зберігати файл","Щоб усі елементи змінювались разом"],"a":0},{"q":"Для чого в колажі використовують маску?","o":["Щоб зробити текст більшим","Щоб скасувати всі дії","Щоб зробити плавний перехід між зображеннями","Щоб змінити розмір полотна"],"a":2},{"q":"Чим маска краща за ластик?","o":["Вона швидше малює","Вона змінює колір зображення","Вона працює лише з текстом","Вона нічого не стирає, приховане можна повернути"],"a":3},{"q":"Що зробити з готовим колажем наприкінці роботи?","o":["Лише закрити програму","Зберегти .xcf і зробити експорт","Видалити всі шари","Об'єднати його з іншим колажем"],"a":1},{"q":"Учень вставив елемент у той самий шар, а не в новий. Що буде складно?","o":["Відкрити друге зображення","Скопіювати виділення","Рухати й змінювати цей елемент окремо","Зберегти файл"],"a":2},{"q":"Край фото сховали маскою, а потім передумали. Що правда?","o":["Приховану частину можна повернути, бо її не видалили","Частина зникла назавжди","Доведеться робити колаж спочатку","Повернути можна лише через експорт"],"a":0},{"q":"Знайди помилку: «Збережу колаж лише як .png, а завтра змінюватиму шари». Що не так?","o":["Нічого, .png зберігає всі шари","У .png немає шарів, щоб їх змінювати, треба було зберегти .xcf",".png не можна відкрити в GIMP","Шари можна змінювати лише до експорту"],"a":1},{"q":"Який порядок дій для колажу правильний?","o":["Додати маску, відкрити фото, вставити шар, зберегти, скопіювати частину","Зберегти, відкрити фото, зменшити, виділити, вставити шар","Вставити шар, виділити частину, відкрити фото, зберегти, додати маску","Відкрити фото, виділити й скопіювати частину, вставити як новий шар, зменшити й розташувати, додати маску, зберегти"],"a":3}]},
"t8-l53":{"grade":"8","classes":["8-А","8-Б","8-В","8-І"],"title":"Шари зображення. Властивості шарів (частина 1)","sub":"Інформатика · 8 клас · Урок 53","q":[{"q":"Що таке шар?","o":["Рівень зображення, який редагують незалежно від інших","Готовий файл для друку","Інструмент для виділення","Фільтр, що розмиває картинку"],"a":0},{"q":"З чим порівнюють шари зображення?","o":["З окремими файлами в різних папках","З ластиком і пензликом","З аркушами кальки, що лежать один на одному","З кнопками на клавіатурі"],"a":2},{"q":"Який шар видно першим?","o":["Той, що лежить унизу","Той, що створений першим","Той, що має найдовшу назву","Той, що лежить угорі"],"a":3},{"q":"Які властивості шару вивчали на цьому уроці?","o":["Розмір і формат файлу","Назва й видимість","Колір пензлика й товщина лінії","Яскравість і баланс кольору"],"a":1},{"q":"Як приховати шар, не видаляючи його?","o":["Перейменувати його","Перетягнути його вниз","Натиснути Redo","Вимкнути його видимість"],"a":3},{"q":"Навіщо шарам давати зрозумілі назви?","o":["Щоб шар став більшим","Щоб швидко знайти потрібний шар","Щоб шар став прозорим","Назви потрібні лише для друку"],"a":1},{"q":"У сцені з трьох шарів: унизу небо, вище дерево, ще вище сонце. Вимкнули видимість шару із сонцем. Що видно?","o":["Небо й дерево","Лише небо","Лише дерево","Нічого, усе зникло"],"a":0},{"q":"Що треба перевірити перед малюванням?","o":["Скільки місця на диску","Який колір у шару","Який шар зараз активний","Чи вимкнена видимість усіх шарів"],"a":2},{"q":"Ти намалював сонце, але його не видно, хоч шар увімкнений. Яка причина?","o":["Шар без назви не показується","Шар із сонцем закритий шаром, що лежить вище","Шари внизу завжди зникають","Видимість вимикається сама під час малювання"],"a":1},{"q":"Учень мав малювати сонце на шарі «Сонце», а активним був шар «Фон». Що вийшло?","o":["Сонце автоматично потрапило в шар «Сонце»","Шар «Фон» зник","Нічого не намалювалось","Сонце намальоване на фоні, і окремо його не змінити"],"a":3},{"q":"Ша "t8-l54":{"grade":"8","classes":["8-А","8-Б","8-В","8-І"],"title":"Шари зображення. Властивості шарів (частина 2)","sub":"Інформатика · 8 клас · Урок 54","q":[{"q":"Що означає прозорість шару 100%?","o":["Шар зовсім не видно","Шар повністю непрозорий, його видно повністю","Шар видно наполовину","Шар об'єднано з іншими"],"a":1},{"q":"Що означає прозорість шару 0%?","o":["Шар зовсім не видно","Шар повністю непрозорий","Шар видно наполовину","Шар видалено разом з іншими"],"a":0},{"q":"Які режими накладання згадували на уроці?","o":["Ластик, пензлик, олівець","Прямокутник, овал, лассо","Множення, екран, накладання","Розмиття, різкість, контраст"],"a":2},{"q":"Що змінює режим накладання?","o":["Назву шару","Розмір полотна","Формат збереження файлу","Те, як кольори шару змішуються з нижніми шарами"],"a":3},{"q":"Що відбувається при об'єднанні (Merge) шарів?","o":["Шари стають прозорішими","Шари міняються місцями","Шари зникають із файлу","Шари стають одним шаром"],"a":3},{"q":"Що не можна зробити після Merge?","o":["Зберегти файл","Редагувати об'єднані шари окремо","Змінити прозорість","Побачити зображення"],"a":1},{"q":"Чим групування відрізняється від Merge?","o":["Групування лише впорядковує шари, Merge робить їх одним","Групування робить шари одним, Merge їх впорядковує","Вони роблять те саме","Групування видаляє нижні шари"],"a":0},{"q":"Що зробить режим «Множення» з кольорами, коли шар накладено на малюнок?","o":["Кольори зникнуть зовсім","Шар стане повністю непрозорим","Кольори стануть темнішими","Шар об'єднається з нижнім"],"a":2},{"q":"Над малюнком лежить шар із кольоровою плямою. Яку пляму видно найкраще?","o":["Із прозорістю 0%","Із прозорістю 100%","Із прозорістю 20%","Усі однаково"],"a":1},{"q":"Учень об'єднав шари, а потім захотів змінити лише верхній. Що вийшло?","o":["Окремо змінити його вже не можна","Усе вийшло, бо шари лишились окремими","Верхній шар зник","Шари повернулись автоматично"],"a":0},{"q":"Коли краще використовувати Merge?","o":["Одразу після створення кожного шару","Перед порівнянням результатів","Щоб тимчасово сховати шар","Лише коли редагувати шари окремо вже не потрібно"],"a":3},{"q":"Знайди помилку: «Прозорість 50% і режим накладання — це одне й те саме». Що не так?","o":["Нічого, це справді одне й те саме","Прозорість об'єднує шари, а режим їх видаляє","Прозорість показує нижні шари крізь верхній, а режим задає, як змішуються кольори","Режим накладання змінює лише назву шару"],"a":2}]},

є найбільше реклами","Той, де можна випробувати тестове фото й побачити результат без водяного знака","Той, назву якого ти не можеш прочитати"],"a":2},{"q":"Сервіс А — простий, але ліміт файлу 2 МБ. Сервіс Б — багато функцій, але ставить водяний знак. Тобі треба змінити формат великого фото для виставки. Що найкраще зробити?","o":["Обрати Б, бо в нього більше функцій","Порівняти обидва за критеріями й урахувати, що знак на виставковому фото псує результат","Обрати А й не дивитися на розмір фото","Не порівнювати, а взяти перший знайдений"],"a":1},{"q":"Учень написав: «Я порівняв два сервіси, обрав Canva». Що він пропустив у висновку?","o":["Назву програми","Дату порівняння","Колір інтерфейсу","Пояснення «тому що…» з аргументами"],"a":3}]},

ідь, бо думає","Бот зламався назавжди","Бот не знає такого запиту, бо в сценарії немає відповіді на нього"],"a":3},{"q":"Учень каже: «Бот думає, як людина, і розуміє все, що ми пишемо». Що тут неправильно?","o":["Усе правильно","Бот не думає, а підбирає готову відповідь за ключовими словами чи кнопками","Бот розуміє лише цифри","Бот розуміє лише картинки"],"a":1},{"q":"Ти закінчив сценарій бота. Яка перевірка потрібна наприкінці?","o":["Чи гарний шрифт у документі","Чи довгі відповіді","Чи на кожне запитання, зокрема незрозуміле, є відповідь","Чи є в сценарії смайлики"],"a":2}]},

"t11-3":{"grade":"11","classes":["11-А","11-Б"],"title":"Основи композиції та дизайну","sub":"Інформатика · 11 клас · Розділ 3","q":[{"q":"Які кольори називають основними в колірному крузі?","o":["Зелений, помаранчевий, фіолетовий","Чорний, білий, сірий","Червоний, зелений, помаранчевий","Червоний, жовтий, синій"],"a":3},{"q":"Які кольори називають комплементарними?","o":["Сусідні на колірному крузі","Протилежні на колірному крузі","Три кольори через рівні проміжки","Лише чорний і білий"],"a":1},{"q":"Які кольори називають аналоговими?","o":["Протилежні на колірному крузі","Лише основні кольори","Сусідні на колірному крузі","Кольори, взяті навмання"],"a":2},{"q":"Що таке Pantone?","o":["Система стандартних кольорів із номерами для точного друку","Програма для малювання","Формат файлу для анімації","Назва шрифту"],"a":0},{"q":"Що таке композиція?","o":["Набір шрифтів у документі","Колір фону зображення","Розташування елементів так, щоб було видно головне й був баланс","Кількість шарів у файлі"],"a":2},{"q":"Що таке бренд?","o":["Образ і репутація компанії в голові людей","Лише логотип на дверях","Список товарів у магазині","Рекламний плакат"],"a":0},{"q":"Що таке брендбук?","o":["Короткий список із двох правил","Сам процес створення бренду","Один логотип у чорно-білому варіанті","Докладний документ із правилами використання фірмового стилю"],"a":3},{"q":"Що входить до айдентики?","o":["Лише ціни","Логотип, кольори, шрифти й інші фірмові елементи","Лише адреса офісу","Лише слоган у рекламі"],"a":1},{"q":"Що означає, що логотип масштабований?","o":["Він залишається чітким і читабельним і малим, і великим","Він має дуже багато кольорів","Його можна змінювати щоразу по-новому","Він складається лише з тексту"],"a":0},{"q":"Дизайнеру потрібне спокійне, м'яке поєднання кольорів без різкого контрасту. Що обрати?","o":["Протилежні кольори на колірному крузі","Найяскравіші кольори без правила","Сусідні кольори на колірному крузі","Тільки чорний із червоним"],"a":2},{"q":"Логот "t11-4":{"grade":"11","classes":["11-А","11-Б"],"title":"Векторна графіка","sub":"Інформатика · 11 клас · Розділ 4","q":[{"q":"Як описано векторне зображення?","o":["Формулами й контурами","Сіткою пікселів","Кадрами анімації","Лише текстом"],"a":0},{"q":"Що буде з векторним малюнком при збільшенні?","o":["З'являться помітні квадратики","Він стане чорно-білим","Він не втратить якості","Файл стане меншим"],"a":2},{"q":"Для чого векторна графіка підходить найкраще?","o":["Для фотографій з тисячами відтінків","Для логотипів, ікон і схем","Лише для відео","Лише для скриншотів"],"a":1},{"q":"Що таке градієнт?","o":["Суцільна заливка одним кольором","Рамка навколо об'єкта","Спосіб групувати об'єкти","Плавний перехід між двома чи більше кольорами"],"a":3},{"q":"Що означає прозорість об'єкта?","o":["Об'єкт не має контуру","Об'єкт пропускає те, що лежить позаду нього","Об'єкт не можна змінювати","Об'єкт має лише один колір"],"a":1},{"q":"Що таке трасування?","o":["Додавання нового шару","Збільшення кількості пікселів","Створення GIF-анімації","Автоматичне перетворення растрового зображення на векторні контури"],"a":3},{"q":"Що таке маскування?","o":["Видалення всього малюнка","Збільшення розміру файлу","Приховування частини об'єкта за допомогою форми-маски","Зміна шрифту"],"a":2},{"q":"Навіщо групують об'єкти у векторному редакторі?","o":["Щоб редагувати кілька об'єктів разом","Щоб збільшити роздільну здатність","Щоб вимкнути заливку","Щоб перетворити їх на фото"],"a":0},{"q":"Яка пара тверджень про растрову графіку правильна?","o":["Складається з контурів і не втрачає якості","Складається з формул і завжди має малий файл","Складається з пікселів і не втрачає якості при збільшенні","Складається з пікселів і втрачає якість при сильному збільшенні"],"a":3},{"q":"Як найлегше намалювати складну ілюстрацію у векторі?","o":["Одразу малювати найдрібніші деталі","Розбити її на прості фігури: кола, прямокутники, трикутники","Намалювати все одним довгим штрихом","Збільшити полотно та не групувати об'єкти"],"a":1},{"q":"Є растровий малюнок логотипа, а для футболки потрібні чіткі контури. Що зробити?","o":["Виконати трасування й отримати векторні контури","Збільшити яскравість","Зменшити глибину кольору","Додати ще один шар із фоном"],"a":0},{"q":"Яке твердження про вибір графіки правильне?","o":["Фото краще у векторному, а логотип — у растровому","І фото, і логотип обов'язково робити тільки у векторі","Фото краще у растровому вигляді, а логотип — у векторному","Тип графіки не впливає ні на що"],"a":2}]},
"t11-5":{"grade":"11","classes":["11-А","11-Б"],"title":"Графічний дизайн у поліграфії","sub":"Інформатика · 11 клас · Розділ 5","q":[{"q":"Що таке комп'ютерна верстка?","o":["Малювання одного зображення від руки","Створення анімації","Компонування тексту й зображень для друку чи публікації","Збереження файлу в архів"],"a":2},{"q":"Що означає кегль?","o":["Відстань між рядками","Вільний край сторінки","Номер сторінки","Розмір шрифту"],"a":3},{"q":"Що таке інтерліньяж?","o":["Відстань між рядками","Розмір шрифту","Великий перший символ абзацу","Відстань між колонками"],"a":0},{"q":"Що таке поля сторінки?","o":["Область з текстом і графікою","Вільний край сторінки","Повторюваний елемент угорі сторінки","Великий декоративний символ"],"a":1},{"q":"Що таке майстер-сторінка?","o":["Остання сторінка видання","Шаблон, що повторюється на кожній сторінці","Сторінка з рекламою","Окремий файл із картинками"],"a":1},{"q":"Що таке колонтитул?","o":["Повторюваний елемент (назва, номер сторінки) на кожній сторінці","Великий декоративний символ на початку абзацу","Відстань між рядками","Рамка навколо ілюстрації"],"a":0},{"q":"Що таке буквиця?","o":["Повторюваний номер сторінки","Підпис під малюнком","Шрифт без засічок","Великий декоративний перший символ абзацу"],"a":3},{"q":"Що таке журнальний розворот?","o":["Одна сторінка обкладинки","Лише великий заголовок","Дві сусідні сторінки, які сприймаються як єдина композиція","Сторінка з усіма контактами"],"a":2},{"q":"Що таке ієрархія інформації?","o":["Однаковий розмір усіх елементів","Випадкове розміщення блоків","Порядок подачі: від головного до другорядного","Кількість сторінок у виданні"],"a":2},{"q":"У листівці весь текст виділено напівжирним і курсивом. Що не так?","o":["Виділення не варто зловживати: інакше не видно, що головне","Напівжирний шрифт не можна друкувати","Курсив робить файл завеликим","Нічого, так завжди краще"],"a":0},{"q":"На розвороті журналу великий блок стоїть на лівій сторінці, а права майже порожня. Що порушено?","o":["Роздільна здатність","Баланс: великий блок слід врівноважити на іншій сторінці","Глибина кольору","Формат файлу GIF"],"a":1},{"q":"У буклеті текст стоїть упритул до краю аркуша. Що може статися при друку й обрізанні?","o":["Текст стане більшим","Усі кольори стануть чорно-білими","Буклет автоматично додасть колонтитули","Край може обрізатися разом із частиною тексту, тому потрібні поля"],"a":3}]},

"t6-3":{"grade":"6","classes":["6-І"],"title":"Текстові документи","sub":"Інформатика · 6-І клас · Тема 3","q":[{"q":"Який список підходить для покупок: хліб, молоко, яблука?","o":["Нумерований, бо кроки йдуть по порядку","Багаторівневий з номерами","Такий запис не можна зробити списком","Маркований, бо порядок не важливий"],"a":3},{"q":"Який список обрати для інструкції «Як заварити чай»?","o":["Маркований, бо порядок не важливий","Нумерований, бо важливий порядок кроків","Без списку, одним довгим реченням","Лише таблицю"],"a":1},{"q":"Як розташований стовпець таблиці?","o":["Горизонтально, зліва направо","По діагоналі","Вертикально, зверху вниз","Лише по краю таблиці"],"a":2},{"q":"Що таке комірка таблиці?","o":["Місце, де перетинаються рядок і стовпець","Увесь рядок таблиці","Увесь стовпець таблиці","Заголовок таблиці"],"a":0},{"q":"Як вставити таблицю в текстовий документ?","o":["«Основне» → «Маркований список»","«Файл» → «Закрити»","«Вставлення» → «Таблиця» і вибрати кількість рядків і стовпців","Надрукувати лінії вручну"],"a":2},{"q":"Як змінити розмір малюнка, щоб він не спотворився?","o":["Потягнути за кутовий маркер","Потягнути за бічний маркер","Стиснути його кліком миші","Змінити шрифт тексту поряд"],"a":0},{"q":"Що таке обтікання тексту?","o":["Підпис під зображенням","Колір фону сторінки","Заливка комірки таблиці","Розташування тексту навколо зображення"],"a":3},{"q":"Що обов'язково має бути в документі практичної роботи «Про мій клас»?","o":["Лише заголовок","Заголовок, список, таблиця й зображення з підписом","Лише таблиця","Лише зображення без підпису"],"a":1},{"q":"Оля надрукувала номери 1., 2., 3. вручну, а потім додала пункт посередині. Що сталося?","o":["Наступні номери не змінилися, і їх треба виправляти вручну","Номери автоматично виправилися","Документ закрився","Список став маркованим"],"a":0},{"q":"Таблиця має 4 рядки і 3 стовпці. Скільки в ній комірок?","o":["7","9","16","12"],"a":3},{"q":"Учень потягнув за бічний маркер, і малюнок став вит "t6-5":{"grade":"6","classes":["6-І"],"title":"Моделювання","sub":"Інформатика · 6-І клас · Тема 5","q":[{"q":"Що таке модель?","o":["Точна копія об'єкта з усіма дрібницями","Справжній об'єкт у зменшеному вигляді","Комп'ютерна програма для малювання","Спрощений образ об'єкта, який допомагає його вивчати"],"a":3},{"q":"Яка модель є матеріальною?","o":["План квартири","Схема метро","Формула площі прямокутника","Глобус"],"a":3},{"q":"План квартири — це модель…","o":["інформаційна","матеріальна","математична","жодна, бо це не модель"],"a":0},{"q":"Формула S = a × b — це модель…","o":["матеріальна","інформаційна","математична","жодна, бо формула — це не модель"],"a":2},{"q":"Що таке гіпотеза?","o":["Факт, який уже всі знають","Думка людини про те, що їй подобається","Припущення, яке ще не доведене й потребує перевірки","Результат експерименту"],"a":2},{"q":"Яке з тверджень можна перевірити як гіпотезу?","o":["Якщо збільшити сторону квадрата вдвічі, його площа збільшиться вчетверо","Квадрати — найгарніші фігури","Червоний колір кращий за синій","Математика — найцікавіший предмет"],"a":0},{"q":"Навіщо міст спочатку перевіряють на макеті?","o":["Щоб макет став справжнім мостом","Бо справжній міст неможливо виміряти","Щоб вивчати його без ризику й великих витрат","Щоб міст був точно такого самого розміру"],"a":2},{"q":"Кімната має ширину 3 м і довжину 4 м. Яка її площа за формулою S = a × b?","o":["12 м²","7 м²","14 м²","34 м²"],"a":0},{"q":"Що означає запис у висновку: «гіпотезу спростовано»?","o":["Експеримент ще не проводили","Експеримент показав, що гіпотеза неправильна","Експеримент показав, що гіпотеза правильна","Гіпотезу не можна перевірити"],"a":1},{"q":"Гіпотеза: «Проїзд автобусом дешевший, ніж маршруткою». Квиток в автобусі 10 грн, у маршрутці 15 грн. Усього 20 поїздок. Який висновок правильний?","o":["Спростовано: 10 × 20 = 200 грн, а 15 × 20 = 300 грн","Підтверджено: 10 + 20 = 30 грн, а 15 + 20 = 35 грн","Висновок зробити не можна, бо немає фото транспорту","Під /* ===== ПІДКЛЮЧЕННЯ ДО ТАБЛИЦІ GOOGLE (вставляється адреса веб-застосунку) ===== */
const API_URL='';
/* ===== ПРОСТІШЕ: результат на пошту через web3forms.com (вставляється ключ) ===== */
const MAIL_KEY='';
/* НАЙПРОСТІШЕ: пошта вчителя; формсабміт без ключів (formsubmit.co) */
const MAIL_TO='';
/* ЖИВА СТРІЧКА: результати відразу в панелі вчителя (ntfy.sh, без реєстрації). Не змінювати! */
const FEED='lsh30-4efe5ca3fea4ad13';
/* ===== утиліти ===== */
const $=(s,r)=> (r||document).querySelector(s);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tname(k){const t=TESTS[k];if(!t)return k;const m=/-l(\d+)$/.exec(k);if(m)return 'Урок '+m[1]+'. '+t.title;const n=/-(\d+)$/.exec(k);return (n?'Розділ '+n[1]+'. ':'')+t.title}
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
async function sendRec(rec){
  if(FEED){
    try{
      const m=enc({t:rec.test,n:rec.name,c:rec.cls,g:rec.grade,e:rec.exits,w:rec.awaySec,s:rec.secs,at:rec.at,a:rec.answers.map(a=>a.ok?1:0)});
      const r=await fetch('https://ntfy.sh/'+FEED,{method:'POST',body:m});
      if(!r.ok)throw new Error('feed');return true
    }catch(e){try{const q=JSON.parse(ls('queue')||'[]');q.push(rec);ls('queue',JSON.stringify(q))}catch(_){}return false}
  }
  if(MAIL_KEY||MAIL_TO){
    try{
      const t=(TESTS[rec.test]||{}).title||rec.test;
      const lines=rec.answers.map((a,i)=>(i+1)+'. '+(a.ok?'✓ ':'✗ ')+a.pick).join('\n');
      const code=enc({t:rec.test,n:rec.name,c:rec.cls,g:rec.grade,e:rec.exits,w:rec.awaySec,s:rec.secs,at:rec.at,a:rec.answers.map(a=>a.ok?1:0),p:rec.answers.map(a=>a.pick)});
      const r=await fetch(MAIL_TO?('https://formsubmit.co/ajax/'+MAIL_TO):'https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({
        access_key:MAIL_KEY,_subject:'Тест: '+rec.name+', '+rec.cls+' — оцінка '+rec.grade+'/12',_template:'table',_captcha:'false',subject:'Тест: '+rec.name+', '+rec.cls+' — оцінка '+rec.grade+'/12',from_name:'Тести з інформатики',
        'Учень':rec.name,'Клас':rec.cls,'Тест':t,'Оцінка (12-бальна)':rec.grade+' із 12','Виходів зі сторінки':rec.exits,'Поза сторінкою, с':rec.awaySec,'Час проходження':fmtTime(rec.secs),
        'Відповіді':lines,'Код результату':code})});
      const j=await r.json();if(j&&(j.success===true||j.success==='true'))return true;throw new Error('mail')
    }catch(e){try{const q=JSON.parse(ls('queue')||'[]');q.push(rec);ls('queue',JSON.stringify(q))}catch(_){}return false}
  }
  try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});return true}
  catch(e){try{const q=JSON.parse(ls('queue')||'[]');q.push(rec);ls('queue',JSON.stringify(q))}catch(_){}return false}
}
async function flushQueue(){if(!FEED&&!API_URL&&!MAIL_KEY&&!MAIL_TO)return;try{const q=JSON.parse(ls('queue')||'[]');if(!q.length)return;ls('queue','[]');for(const r of q)await sendRec(r)}catch(e){}}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s.trim()))))}
const fmtTime=s=>Math.floor(s/60)+' хв '+String(s%60).padStart(2,'0')+' с';
let CL={db:null,user:null,dl:null,isOwner:false};

async function boot(){
  window.addEventListener('hashchange',route);
  route();flushQueue();
  window.addEventListener('online',flushQueue);
  try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  route(true);
}
function route(soft){
  const h=(location.hash||'').replace('#','');
  if(soft&&state.running)return;
  if(h==='teacher')return teacherView();
  if(TESTS[h])return startView(h);
  homeView();
}

}
/* код доступу: клас(2) + тип(1=розділ,2=урок) + номер(2), напр. 07212 = 7 клас, урок 12 */
const p2=n=>String(n).padStart(2,'0');
function codeOf(k){const t=TESTS[k];if(!t)return '';const l=/-l(\d+)$/.exec(k);if(l)return p2(t.grade)+'2'+p2(l[1]);const n=/-(\d+)$/.exec(k);return p2(t.grade)+'1'+p2(n?n[1]:0)}
function keyByCode(c){return Object.keys(TESTS).find(k=>codeOf(k)===c)||''}

/* ===== ТЕСТ ===== */
const state={running:false};
function startView(id){
  const T=TESTS[id];state.running=false;
  app.innerHTML=`<div class="card"><div class="eyebrow">${esc(T.sub)}</div><h1>${esc(T.title)}</h1>
  <p class="muted">12 запитань, одна правильна відповідь у кожному. Повернутися до попереднього запитання не можна.</p>
  <div class="note"><b>Важливо.</b> Не виходь зі сторінки й не перемикай вкладки під час тесту. Кожен вихід фіксується й показується вчителю.</div>
  <label for="nm">Прізвище та ім'я</label><input type="text" id="nm" autocomplete="off" placeholder="Наприклад: Коваленко Олена">
  <label for="cl">Клас</label><select id="cl"><option value="">Обери клас</option>${T.classes.map(c=>`<option>${c}</option>`).join('')}</select>
  <div class="row" style="margin-top:20px"><button class="btn pri" id="go" disabled>Почати тест</button></div></div>`;
  const chk=()=>{$('#go').disabled=!($('#nm').value.trim().length>=3&&$('#cl').value)};
  $('#nm').oninput=chk;$('#cl').onchange=chk;
  $('#go').onclick=()=>runTest(id,$('#nm').value.trim(),$('#cl').value);
}
function runTest(id,name,cls){
  const T=TESTS[id];
  const Q=shuffle(T.q).map(q=>{const opts=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));return{q:q.q,opts}});
  const S={id,name,cls,Q,i:0,ans:[],exits:0,awayMs:0,leftAt:0,t0:Date.now(),sel:-1};
  state.running=true;state.S=S;
  const leave=()=>{if(!S.leftAt&&!S.done){S.leftAt=Date.now();S.exits++}};
  const back=()=>{if(S.leftAt){S.awayMs+=Date.now()-S.leftAt;S.leftAt=0;badge()}};
  const vis=()=>document.hidden?leave():back();
  document.addEventListener('visibilitychange',vis);
  window.addEventListener('blur',leave);window.addEventListener('focus',back);
  S.cleanup=()=>{document.removeEventListener('visibilitychange',vis);window.removeEventListener('blur',leave);window.removeEventListener('focus',back)};
  function badge(){const b=$('#ex');if(b){b.textContent='Виходів зі сторінки: '+S.exits;b.className='pill '+(S.exits?'bad':'good')}}
  function show(){
    const q=S.Q[S.i];S.sel=-1;
    app.innerHTML=`<div class="card"><div class="row"><div class="eyebrow sp">Запитання ${S.i+1} з 12</div><span id="ex" class="pill good">Виходів зі сторінки: ${S.exits}</span></div>
    <div class="bar"><i style="width:${Math.max(0,S.i-1)/12*100}%" data-w="${S.i/12*100}"></i></div>
    <h2>${esc(q.q)}</h2><div style="margin-top:16px" id="opts">${q.opts.map((o,k)=>`<button class="opt" style="--d:${k}" data-k="${k}" aria-pressed="false"><b>${'АБВГ'[k]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:8px"><span class="sp"></span><button class="btn pri" id="nx" disabled>${S.i===11?'Завершити':'Далі'}</button></div></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('.bar i');if(f)f.style.width=f.dataset.w+'%'}));
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.k;document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#nx').disabled=false});
    $('#nx').onclick=()=>{const o=q.opts[S.sel];S.ans.push({q:q.q,pick:o.t,ok:o.ok,right:q.opts.find(x=>x.ok).t});if(S.i===11)finish();else{S.i++;show()}};
  }
  show();
}
async function finish(){
  const S=state.S;S.done=true;S.cleanup();state.running=false;
  if(S.leftAt){S.awayMs+=Date.now()-S.leftAt;S.leftAt=0}
  const T=TESTS[S.id];const correct=S.ans.filter(a=>a.ok).length;const secs=Math.round((Date.now()-S.t0)/1000);

    answers:S.ans.map(a=>({q:a.q,pick:a.pick,ok:a.ok}))};
  const code=enc({t:rec.test,n:rec.name,c:rec.cls,g:rec.grade,e:rec.exits,w:rec.awaySec,s:rec.secs,at:rec.at,a:S.ans.map(a=>a.ok?1:0),p:S.ans.map(a=>a.pick)});
  const warn=S.exits?`<span class="pill bad">Виходів зі сторінки: ${S.exits}</span>`:`<span class="pill good">Виходів зі сторінки: 0</span>`;
  app.innerHTML=`<div class="card"><div class="eyebrow">${esc(T.title)}</div><h1>${esc(S.name)}, ${esc(S.cls)}</h1>
   <div style="margin:18px 0 6px" class="muted">Твоя оцінка (12-бальна шкала)</div><div class="grade">${correct}</div>
   <div class="stats"><div><b>${correct} з 12</b><span class="muted">правильних</span></div><div><b>${fmtTime(secs)}</b><span class="muted">час</span></div><div><b>${S.exits}</b><span class="muted">виходів зі сторінки</span></div></div>
   <div id="send" class="note">Надсилаю результат учителю…</div></div>
   <div class="card"><h2>Розбір відповідей</h2><div style="margin-top:12px">${S.ans.map((a,i)=>`<div class="rev ${a.ok?'ok':'no'}" style="--d:${i}"><b>${i+1}. ${esc(a.q)}</b><br>Твоя відповідь: ${esc(a.pick)}${a.ok?' ✓':`<br>Правильно: ${esc(a.right)}`}</div>`).join('')}</div></div>`;
  (function(){const g=$('.grade');if(!g||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/900);g.textContent=Math.round(correct*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0);
    if(correct>=9){const cols=['#1f6f5c','#f3b43a','#d8504d','#4a7fd8','#7b5fc4'];for(let i=0;i<34;i++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDuration=(2.2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.8)+'s';document.body.append(c);setTimeout(()=>c.remove(),5200)}}})();
  let sent=false;
  if(FEED||API_URL||MAIL_KEY||MAIL_TO){sent=await sendRec(rec)}
  const box=$('#send');
  if(sent){box.className='note';box.innerHTML='<span class="pill good">Результат надіслано вчителю</span> Можеш закривати сторінку.'}
  else if(FEED||API_URL||MAIL_KEY||MAIL_TO){box.innerHTML='<b>Немає зв\'язку з інтернетом.</b> Результат збережено на цьому пристрої й надішлеться сам, коли зв\'язок з\'явиться. Не закривай цю вкладку, поки не побачиш зелене повідомлення.';window.addEventListener('online',()=>flushQueue().then(()=>{box.innerHTML='<span class="pill good">Результат надіслано вчителю</span>'}),{once:true})}
  else{box.innerHTML=`<b>Надішли результат учителю.</b><br>Натисни «Копіювати результат» і надішли текст учителю в чат (Viber/Telegram).<div class="code" style="margin:10px 0">${esc(code)}</div><button class="btn pri" id="cp">Копіювати результат</button> <span id="cpm" class="muted"></span>`;
    $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#cpm').textContent='Скопійовано'}catch(e){const r=document.createRange();r.selectNodeContents($('.code'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#cpm').textContent='Виділено, скопіюй вручну'}}}
}

/* ===== ПАНЕЛЬ ВЧИТЕЛЯ ===== */
let unsub=null,pinOk=false;
const hsh=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let KEY='';
async function fetchRows(key){const r=await fetch(API_URL+'?key='+encodeURIComponent(key));const j=await r.json();if(!j.rows)throw new Error(j.error||'bad');return j.rows}
function pinGate(){
  if(API_URL){
    app.innerHTML=`<div class="card"><div class="eyebrow">Лоюк С. Ю.</div><h1>Панель вчителя</h1>
    <p class="muted">Введи свій пароль від таблиці результатів.</p>
    <label for="pin">Пароль</label><input type="text" id="pin" autocomplete="off" style="max-width:260px">
    <div class="row" style="margin-top:16px"><button class="btn pri" id="pg">Увійти</button><span id="pe" class="pill bad" hidden>Невірний пароль або немає зв'язку</span></div></div>`;
    const go=async()=>{const v=$('#pin').value.trim();if(!v)return;try{await fetchRows(v);KEY=v;ls('key',v);pinOk=true;teacherView()}catch(e){$('#pe').hidden=false}};
    $('#pg').onclick=go;
    const saved=ls('key');if(saved){$('#pin').value=saved;go()}
    return;
  }
  const has=ls('pinh');
  app.innerHTML=`<div class="card"><div class="eyebrow">Лоюк С. Ю.</div><h1>Панель вчителя</h1>
  <p class="muted">${has?'Введи свій PIN-код.':'Придумай PIN-код (щонайменше 4 цифри). Він збережеться лише в цьому браузері.'}</p>
  <label for="pin">PIN</label><input type="text" id="pin" inputmode="numeric" autocomplete="off" style="max-width:220px">
  <div class="row" style="margin-top:16px"><button class="btn pri" id="pg">${has?'Увійти':'Зберегти й увійти'}</button><span id="pe" class="pill bad" hidden>Невірний PIN</span></div></div>`;
  $('#pg').onclick=()=>{const v=$('#pin').value.trim();if(v.length<4)return;if(!has){ls('pinh',hsh(v));pinOk=true;teacherView()}else if(hsh(v)===has){pinOk=true;teacherView()}else $('#pe').hidden=false};
}
function teacherView(){
  state.running=false;
  if(!pinOk){return pinGate()}
  document.getElementById('app').className='wrap wide';
  const base=location.href.split('#')[0];
  app.innerHTML=`<div class="card"><div class="eyebrow">Лоюк С. Ю.</div><h1>Панель вчителя</h1>
  <p class="muted">QR-коди тестів, результати класів, виходи зі сторінки й оцінки.</p><p><button class="btn" id="clr">Очистити таблицю</button></p></div>
  <div class="card"><h2>QR-код тесту</h2><p class="muted">Обери клас і тему — код відкриється на весь екран, його видно з останньої парти.</p><div class="row" style="margin-top:12px"><select id="qg" style="width:auto;max-width:100%"></select><select id="qt" style="width:auto;max-width:100%;flex:1"></select></div></div>
  <div class="card"><div class="row"><h2 class="sp">Результати</h2>
   <select id="ft" style="width:auto;max-width:100%"><option value="">Усі тести</option>${['6','7','8','11'].map(g=>{const L=Object.entries(TESTS).filter(([k,t])=>t.grade===g);return L.length?`<optgroup label="${g==='6'?'6-І':g} клас">${L.map(([k,t])=>`<option value="${k}">${esc(tname(k))}</option>`).join('')}</optgroup>`:''}).join('')}</select>
   <select id="fc" style="width:auto;max-width:100%"><option value="">Усі класи</option></select>
   <button class="btn" id="csv">Завантажити CSV</button></div>
   <div class="tw" style="margin-top:12px"><table><thead><tr><th>Учень</th><th>Клас</th><th>Оцінка</th><th>Виходів</th><th>Тест</th><th>Поза сторінкою</th><th>Час</th><th>Коли</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="muted">Завантаження…</td></tr></tbody></table></div></div>
  <details class="card"><summary style="cursor:pointer;font-weight:800">Додати результати вручну (за потреби)</summary><h2 style="margin-top:12px">Додати результати з чату</h2><p class="muted">Учні надсилають вам код результату. Встав коди сюди, кожен з нового рядка. Таблиця зберігається в цьому браузері.</p>
   <textarea id="paste" placeholder="Встав коди сюди"></textarea><div class="row" style="margin-top:10px"><button class="btn pri" id="addp">Додати до таблиці</button><span id="pm" class="muted"></span></div></details>`;
  $('#clr').onclick=()=>{if(!$('#clr').dataset.s){$('#clr').dataset.s=1;$('#clr').textContent='Натисни ще раз, щоб очистити';return}manual=[];ls('manual','[]');draw()};
  const qg=$('#qg'),qt=$('#qt');
  const gl=g=>g==='6'?'6-І':g;
  const listFor=g=>{const L=Object.keys(TESTS).filter(k=>TESTS[k].grade===g);const num=(k,re)=>+(re.exec(k)||[0,0])[1];
    const sec=L.filter(k=>!/-l\d+$/.test(k)).sort((x,y)=>num(x,/-(\d+)$/)-num(y,/-(\d+)$/)),les=L.filter(k=>/-l\d+$/.test(k)).sort((x,y)=>num(x,/-l(\d+)$/)-num(y,/-l(\d+)$/));return {sec,les,all:sec.concat(les)}};
  const grades=['6','7','8','11'].filter(g=>Object.values(TESTS).some(t=>t.grade===g));
  grades.forEach(g=>qg.append(new Option(gl(g)+' клас',g)));
  const fillT=()=>{const {sec,les}=listFor(qg.value);qt.innerHTML='<option value="">— обери тему, щоб показати QR —</option>';
    const og=(lab,arr)=>{if(!arr.length)return;const o=document.createElement('optgroup');o.label=lab;arr.forEach(k=>o.append(new Option(tname(k),k)));qt.append(o)};
    og('Розділові тести',sec);og('Тести до уроків',les)};
  qg.onchange=fillT;fillT();
  let ov=null,cur='',curList=[];
  const showQR=k=>{
    cur=k;const t=TESTS[k];const url=base+'#'+k;let svg='';
    try{const q=qrcode(0,'M');q.addData(url);q.make();svg=q.createSvgTag({cellSize:5,margin:2,scalable:true})}catch(e){svg='<p>QR недоступний</p>'}
    if(!ov){ov=el('<div class="qov" role="dialog" aria-modal="true"><div class="qbox"><div class="qeye"></div><div class="qttl"></div><div class="qring"><div class="qcode"></div></div><div class="qacc"></div><div class="qurl"></div><div class="qnav"><button class="btn" data-d="-1">← Попередній</button><button class="btn pri" data-d="0">Закрити ✕</button><button class="btn" data-d="1">Наступний →</button><button class="btn" data-d="c">Скопіювати посилання</button></div></div></div>');
      document.body.append(ov);
      ov.addEventListener('click',e=>{const b=e.target.closest('button');if(b){if(b.dataset.d==='c'){const u=base+'#'+cur;const ok=()=>{b.textContent='Скопійовано ✓';setTimeout(()=>b.textContent='Скопіювати посилання',1800)};const fb=()=>{const ta=document.createElement('textarea');ta.value=u;document.body.append(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,fb);else fb();return}const d=+b.dataset.d;if(!d)closeQR();else step(d);return}if(e.target===ov)closeQR()});
      document.addEventListener('keydown',e=>{if(!ov||!ov.classList.contains('on'))return;if(e.key==='Escape')closeQR();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)})}
    ov.querySelector('.qeye').textContent=gl(t.grade)+' клас';ov.querySelector('.qttl').textContent=tname(k);
    ov.querySelector('.qurl').textContent=url;ov.querySelector('.qacc').innerHTML='Код доступу: <b>'+codeOf(k)+'</b>';
    const code=ov.querySelector('.qcode');code.innerHTML=svg;code.classList.remove('flip');void code.offsetWidth;code.classList.add('flip');
    ov.classList.add('on');document.body.style.overflow='hidden';
  };
  const closeQR=()=>{if(ov)ov.classList.remove('on');document.body.style.overflow='';qt.value=''};
  const step=d=>{const i=curList.indexOf(cur);const j=i+d;if(j>=0&&j<curList.length)showQR(curList[j])};
  qt.onchange=()=>{if(!qt.value)return;curList=listFor(qg.value).all;showQR(qt.value)};
  const fc=$('#fc');[...new Set(Object.values(TESTS).flatMap(t=>t.classes))].forEach(c=>fc.append(new Option(c,c)));
  let rows=[];let manual=[];try{manual=JSON.parse(ls('manual')||'[]')}catch(e){}
  const draw=()=>{
    const ft=$('#ft').value,cc=$('#fc').value;
    let L=rows.concat(manual).filter(r=>(!ft||r.test===ft)&&(!cc||r.cls===cc)).sort((a,b)=>(a.cls||'').localeCompare(b.cls||'')||(a.name||'').localeCompare(b.name||'','uk'));
    $('#rows').innerHTML=L.length?L.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td class="n"><b>${r.grade}</b> / 12</td><td class="n"><span class="pill ${r.exits?'bad':'good'}">${r.exits}</span></td><td>${esc(tname(r.test))}</td><td class="n">${r.awaySec} с</td><td class="n">${fmtTime(r.secs)}</td><td>${new Date(r.at).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td></tr>`).join(''):'<tr><td colspan="8" class="muted">Поки що немає результатів</td></tr>';
    draw.L=L;
  };
  $('#ft').onchange=draw;$('#fc').onchange=draw;
  $('#addp').onclick=()=>{let ok=0,bad=0;$('#paste').value.split(/\n+/).filter(x=>x.trim()).forEach(s=>{try{const d=dec(s);manual.push({test:d.t,name:d.n,cls:d.c,grade:d.g,exits:d.e,awaySec:d.w,secs:d.s,at:d.at});ok++}catch(e){bad++}});$('#pm').textContent=`Додано: ${ok}${bad?`, не розпізнано: ${bad}`:''}`;ls('manual',JSON.stringify(manual));$('#paste').value='';draw()};
  $('#csv').onclick=async()=>{
    const head=['Учень','Клас','Тест','Оцінка','Виходів','Поза сторінкою, с','Час, с','Коли'];
    const body=(draw.L||[]).map(r=>[r.name,r.cls,tname(r.test),r.grade,r.exits,r.awaySec,r.secs,new Date(r.at).toLocaleString('uk-UA')]);
    const csv='﻿'+[head,...body].map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='results.csv';document.body.append(a);a.click();a.remove();
  };
  draw();
  if(FEED){
    let feed=[];try{feed=JSON.parse(ls('feed')||'[]')}catch(e){}
    let cut=+(ls('cut')||0);
    rows=feed;draw();
    $('#clr').onclick=()=>{if(!$('#clr').dataset.s){$('#clr').dataset.s=1;$('#clr').textContent='Натисни ще раз, щоб очистити';return}manual=[];ls('manual','[]');feed=[];rows=[];cut=Date.now();ls('cut',String(cut));ls('feed','[]');draw();$('#clr').dataset.s='';$('#clr').textContent='Очистити таблицю'};
    const loadF=async()=>{try{
      const r=await fetch('https://ntfy.sh/'+FEED+'/json?poll=1&since=all');const t=await r.text();
      const seen=new Set(feed.map(x=>x.at+'|'+x.name+'|'+x.test));
      t.split('\n').filter(Boolean).forEach(l=>{try{const j=JSON.parse(l);if(j.event!=='message')return;const d=dec(j.message);if(d.at<cut)return;const k=d.at+'|'+d.n+'|'+d.t;if(seen.has(k))return;seen.add(k);feed.push({test:d.t,name:d.n,cls:d.c,grade:d.g,exits:d.e,awaySec:d.w,secs:d.s,at:d.at})}catch(e){}});
      ls('feed',JSON.stringify(feed));rows=feed;draw();const st=$('#fst');if(st)st.textContent='Оновлено '+new Date().toLocaleTimeString('uk-UA')
    }catch(e){const st=$('#fst');if(st)st.textContent='Немає зв\'язку, спробую ще раз…'}};
    $('#csv').insertAdjacentHTML('beforebegin','<span class="muted" id="fst"></span>');
    loadF();clearInterval(window._rt);window._rt=setInterval(()=>{if(location.hash==='#teacher')loadF()},5000);
  }
  if(API_URL){
    const load=async()=>{try{rows=await fetchRows(KEY);draw()}catch(e){$('#rows').innerHTML='<tr><td colspan="8" class="muted">Не вдалося завантажити результати</td></tr>'}};
    $('#csv').insertAdjacentHTML('beforebegin','<button class="btn" id="rf">Оновити</button>');
    $('#rf').onclick=load;load();
    clearInterval(window._rt);window._rt=setInterval(()=>{if(location.hash==='#teacher')load()},15000);
  }
}
boot();
</script>
</body></html>
